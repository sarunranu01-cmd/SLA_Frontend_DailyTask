<section id="register" class="py-5">
    <div class="container">
        <div class="row g-5 align-items-center  ">
            <div class="col-lg-7  ">
                <div class="card border-0 shadow p-4 bg-warning">
                    <h3 class="fw-bold mb-4 text-center">
                       fill the form
                    </h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">
                                    Full Name
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    placeholder="Enter your name">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">
                                    Mobile Number
                                </label>
                                <input
                                    type="tel"
                                    class="form-control"
                                    placeholder="Enter mobile number">
                            </div>
                            <div class="col-12">
                                <label class="form-label">
                                    Email Address
                                </label>
                                <input
                                    type="email"
                                    class="form-control"
                                    placeholder="Enter email">
                            </div>
                            <div class="col-12">
                                <label class="form-label">
                                    Address
                                </label>
                                <textarea
                                    class="form-control"
                                    rows="4"
                                    placeholder="Enter your address">
                                </textarea>
                            </div>
                            <div class="col-12">
                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox">
                                    <label class="form-check-label">
                                        I agree to the terms and conditions
                                    </label>
                                </div>
                            </div>
                            <div class="col-12">

                                <button
                                    type="submit"
                                    class="btn btn-success px-4">
                                    Register Now
                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

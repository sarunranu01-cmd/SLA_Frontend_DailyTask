<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <center>
    <header>
        <h1>Registration Form</h1>
    </header>
    
    <hr>
    <form action="" method="post">
        <table>
            <tr>
                <td><label for="name">Name</label></td><td>:</td>
                <td><input type="text" name="name" id="name"></td>
            </tr>
            <tr>
                <td><label for="Email">Email</label></td><td>:</td>
                <td><input type="email" name="Email" id="Email"></td>
            </tr>
            <tr>
                <td><label for="Password">Password</label></td><td>:</td>
                <td><input type="password" name="Password" id="Password" maxlength="8"></td>
            </tr>
            <tr>
                <td><label for="">Confirm Password</label></td><td>:</td>
                <td><input type="password" name="Password" id="Password" maxlength="8"></td>
            </tr>
            <tr>
                <td><label for="Gender">Gender</label></td><td>:</td>
                <td><input type="radio" value="Gender" name="Gender">Male  <input type="radio" value="Gender" name="Gender">FeMale  <input type="radio" value="Gender" name="Gender">Other</td>
                
            </tr>
            <tr>
                <td><label>Date of Birth</label></td><td>:</td>
                <td><input type="date" ></td>
            </tr>
            <tr>
                <td><label for="PH_namber">Namber</label></td><td>:</td>
                <td><input type="namber" name="PH_namber" minlength="10" maxlength="10"></td>
            </tr>
            <tr>
                <td><label >Address</label></td><td>:</td>
                <td><textarea name="Address" id="Address"></textarea></td>
            </tr>
            <tr>
            <td></td><td></td>
            <td><input type="submit" value="Register">   <input type="reset" value="Reset"></td>
            </tr>

        </table>
    </form>
    </center>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>
<body>
    <center>
        <header>
            <h1>Feedback Form</h1>
        </header>
    <hr>
    <form action="" method="post">
        <table>
            <tr>
                <td><label for="name">Name</label></td><td>:</td>
                <td><input type="text" name="name" id="name"></td>
            </tr>
            <tr>
                <td><label for="Email">Email</label></td><td>:</td>
                <td><input type="email" name="Email" id="Email"></td>
            </tr>
            <tr>
                <td><label>Rating</label></td><td>:</td>
                <td><input type="radio" value="Rating" name="Rating">Excellent  <input type="radio" value="Rating" name="Rating">Good  <input type="radio" value="Rating" name="Rating">Poor</td>
                
            </tr>
            <tr>
                <td><label for="Feedback">Feedback</label></td><td>:</td>
                <td><textarea name="Feedback" id="Feedback"> </textarea></td>
            </tr>

            <tr>
            <td></td><td></td>
            <td><input type="submit" value="Submit">   <input type="reset" value="Reset"></td>
            </tr>
        </table>
    </form>
    </center>
</body>
</html>

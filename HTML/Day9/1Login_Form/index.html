<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <center>
    <header>
        <h1>Login form</h1>
    </header>
    
    <hr>
    <form action="" method="post">
        <table>
            <tr>
                <td><label for="">Username:</label></td>
                <td><input type="text" name="Username" placeholder="start capital letter"></td>
            </tr>
            <tr>
                <td> <label>Password:</label></td>
                <td> <input type="password" minlength="8" placeholder="Enter 8 digit"></td>
            </tr>
             <tr>
                <td><input type="button" value="submit"></td>
                <td><input type="reset" value="reset"></td> 
             </tr>
        </table>
    </form>
    </center>
</body>
</html>
